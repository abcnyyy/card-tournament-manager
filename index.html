<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>卡牌赛事编排</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:;">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <h1>卡牌赛事编排</h1>
      <div class="sub" id="topbarSub">未创建赛事</div>
    </div>
    <div class="right noprint">
      <button class="btn" id="btnList">赛事列表</button>
      <button class="btn" id="btnNew">新建赛事</button>
      <button class="btn" id="btnSave">保存</button>
      <button class="btn" id="btnLoad">载入存档</button>
    </div>
  </div>

  <div class="tabs noprint">
    <button class="tab" data-view="list">⓪ 赛事列表</button>
    <button class="tab active" data-view="setup">① 赛事设置</button>
    <button class="tab" data-view="players">② 选手管理</button>
    <button class="tab" data-view="matches">③ 对阵与录入</button>
    <button class="tab" data-view="standing">④ 排名</button>
    <button class="tab" data-view="export">⑤ 导出</button>
  </div>

  <div class="main">
    <div id="view-list"     class="view" style="display:none"></div>
    <div id="view-setup"    class="view"></div>
    <div id="view-players"  class="view" style="display:none"></div>
    <div id="view-matches"  class="view" style="display:none"></div>
    <div id="view-standing" class="view" style="display:none"></div>
    <div id="view-export"   class="view" style="display:none"></div>
  </div>

</div>

<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<script src="js/core.js"></script>
<script src="js/formats.js"></script>
<script src="js/engine.js"></script>
<script src="js/exporter.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
