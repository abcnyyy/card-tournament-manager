name: 💡 功能请求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 这个功能的背景与动机
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望怎么实现 / 长什么样
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: 备选方案
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
    validations:
      required: false
