<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>卡牌赛事编排</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:;">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <!-- ---------- 左侧导航（手机端变顶部横滑 chips） ---------- -->
  <aside class="sidebar noprint">
    <div class="brand">
      <div class="brand-logo">CT</div>
      <div>
        <b>卡牌赛事编排</b>
        <div class="brand-sub">本地离线 · 无需联网</div>
      </div>
    </div>

    <nav class="tabs">
      <button class="tab" data-view="list"><span class="tno">0</span><span class="tlabel">赛事列表</span></button>
      <button class="tab active" data-view="setup"><span class="tno">1</span><span class="tlabel">赛事设置</span></button>
      <button class="tab" data-view="players"><span class="tno">2</span><span class="tlabel">选手管理</span></button>
      <button class="tab" data-view="matches"><span class="tno">3</span><span class="tlabel">对阵与录入</span></button>
      <button class="tab" data-view="standing"><span class="tno">4</span><span class="tlabel">排名</span></button>
      <button class="tab" data-view="export"><span class="tno">5</span><span class="tlabel">导出</span></button>
      <button class="tab" data-view="season"><span class="tno">6</span><span class="tlabel">赛季积分</span></button>
    </nav>

    <div class="sidebar-foot" id="sideFoot">v3.0.2</div>
  </aside>

  <div class="content">

    <div class="topbar">
      <div class="sub" id="topbarSub">未创建赛事</div>
      <div class="right noprint">
        <button class="btn" id="btnLang">EN</button>
        <button class="btn" id="btnList">赛事列表</button>
        <button class="btn" id="btnNew">新建赛事</button>
        <button class="btn" id="btnSave">保存</button>
        <button class="btn" id="btnLoad">载入存档</button>
      </div>
    </div>

    <div class="main">
      <div id="view-list"     class="view" style="display:none"></div>
      <div id="view-setup"    class="view"></div>
      <div id="view-players"  class="view" style="display:none"></div>
      <div id="view-matches"  class="view" style="display:none"></div>
      <div id="view-standing" class="view" style="display:none"></div>
      <div id="view-export"   class="view" style="display:none"></div>
      <div id="view-season"   class="view" style="display:none"></div>
    </div>

  </div>

</div>

<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<script src="js/i18n.js"></script>
<script src="js/i18n.en.js"></script>
<script src="js/core.js"></script>
<script src="js/formats.js"></script>
<script src="js/engine.js"></script>
<script src="js/grab.js"></script>
<script src="js/pdfgen.js"></script>
<script src="js/exporter.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
